<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Digital">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Erscheinungsbild vor dem ersten Zeichnen setzen (kein helles Aufblitzen)
    (function () {
      var t = 'auto';
      try { t = (JSON.parse(localStorage.getItem('digitalweb.v1.settings') || '{}').theme) || 'auto'; } catch (e) { }
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <title>Digital Web – Schaltungssimulator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button class="tb" id="btnMenu" title="Datei"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Menü</span></button>
    <button class="tb" id="btnBack" hidden title="Zurück"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="backLabel"></span></button>
    <button class="title" id="btnDocs" title="Schaltungen im Projekt"><span id="docCount">Projekt</span><b id="fileName">Schaltung</b></button>
    <div class="group edit-only">
      <button class="tb" id="btnUndo" title="Rückgängig"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tb" id="btnRedo" title="Wiederholen"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <span class="sep"></span>
      <button class="tb toggle" id="btnRect" title="Mehrere auswählen (Rechteck)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1" stroke-dasharray="3 3"/></svg><span>Auswahl</span></button>
      <button class="tb" id="btnRotate" title="Drehen (R)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Drehen</span></button>
      <button class="tb" id="btnDup" title="Duplizieren"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>Kopie</span></button>
      <button class="tb danger" id="btnDelete" title="Löschen"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Löschen</span></button>
    </div>
    <div class="spacer"></div>
    <button class="tb" id="btnTable" title="Wahrheitstabelle"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M9 4v16"/></svg><span>Tabelle</span></button>
    <button class="tb" id="btnTest" hidden title="Testfälle ausführen"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></svg><span>Test</span></button>
    <button class="tb sim-only toggle" id="btnGraph" title="Messgraph"><svg viewBox="0 0 24 24"><path d="M3 7h3v-3h4v3h4v-3h3v3h4M3 17h5v-3h6v3h7"/></svg><span>Messgraph</span></button>
    <button class="tb sim-only" id="btnFreq" title="Taktfrequenz"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span id="freqLabel">1 Hz</span></button>
    <button class="tb sim-only" id="btnStep" title="Takt umschalten"><svg viewBox="0 0 24 24"><path d="M3 17h4V7h5v10h5V7h4"/></svg><span>Takt</span></button>
    <button class="tb play" id="btnSim" title="Simulation starten/stoppen"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></svg><span id="simLabel">Start</span></button>
  </header>

  <main>
    <aside id="palette" class="edit-only"></aside>
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div id="hint">
          <h2>Willkommen!</h2>
          <p>Tippe links auf ein Bauteil oder ziehe es auf die Fläche.</p>
          <p>Ziehe von einem <b>Anschlusspunkt</b> aus, um eine Leitung zu zeichnen.</p>
          <p>Mit <b>Start</b> wird simuliert – dann schaltest du Eingänge durch Antippen.</p>
          <button class="btn" id="btnExample">Beispiel öffnen</button>
        </div>
        <div id="zoom">
          <button id="zoomIn" title="Vergrößern">+</button>
          <button id="zoomOut" title="Verkleinern">−</button>
          <button id="zoomFit" title="Alles anzeigen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <div id="simBadge">Simulation läuft – Schalter antippen</div>
        <div id="graph"><div class="graph-head"><b>Messgraph</b><span class="spacer"></span><button class="btn small" id="graphClear">Leeren</button><button class="btn small" id="graphClose">Schließen</button></div><canvas id="graphCanvas"></canvas></div>
      </div>
      <aside id="tablePanel"></aside>
    </div>
    <aside id="props"></aside>
  </main>

  <div id="toast"></div>
  <div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
  <input type="file" id="fileInput" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
